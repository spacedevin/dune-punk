# When a prerelease is promoted to a full release (Edit release → uncheck "Set as a pre-release"),
# publish its .vsix to Open VSX. Prereleases never leave GitHub. Re-running on an `edited` event is
# safe: a version that is already live on Open VSX is skipped.
#
# Open VSX auth: the OVSX_PAT secret while it exists; once THIS workflow (publish.yml) is registered
# as the spacedevin namespace's trusted publisher on open-vsx.org, delete the secret and releases
# authenticate with a short-lived GitHub OIDC token.

name: Publish to Open VSX

on:
  release:
    types: [released, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Promoting a release fires both `released` and `edited`; queue runs per tag so the second one sees
# the version as live instead of racing the first to Open VSX.
concurrency:
  group: openvsx-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    # Only full releases. Skip while still a prerelease/draft.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve tag/version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; else TAG="${{ github.event.release.tag_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Already on Open VSX?
        id: live
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ID=$(node -p "const p=require('./package.json'); p.publisher + '/' + p.name")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://open-vsx.org/api/$ID/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "::notice::$ID $VERSION is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release .vsix
        if: steps.live.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.ver.outputs.tag }}" --pattern "*.vsix" --dir dist

      - name: Publish
        if: steps.live.outputs.skip != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -n "$OVSX_PAT" ]; then AUTH=(-p "$OVSX_PAT"); else AUTH=(--trusted-publishing); fi
          if ! npx -y ovsx publish dist/*.vsix "${AUTH[@]}" 2>&1 | tee publish.log; then
            # Open VSX reports a version that exists but is still inactive (e.g. an unverified
            # namespace) as an error; the version IS published, so don't fail the release.
            grep -q "is already published" publish.log && { echo "::notice::already published"; exit 0; }
            exit 1
          fi
