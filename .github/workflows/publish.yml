name: Build & Publish
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Theme JSONs are generated from palette.mjs / variants.mjs; the Dune key list is optional at
      # build time (validation skips the key-name check when it is absent).
      - run: node build.mjs
      - name: Generated themes are committed
        run: git diff --exit-code -- themes icons
      - run: npx -y @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::error::OVSX_PAT secret is not set (Settings → Secrets → Actions)"; exit 1; fi
          npx -y ovsx publish *.vsix -p "$OVSX_PAT"
