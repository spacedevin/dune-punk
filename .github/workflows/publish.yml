name: Build & Publish
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Theme JSONs are generated from palette.mjs / variants.mjs; the Dune key list is optional at
      # build time (validation skips the key-name check when it is absent).
      - run: node build.mjs
      - name: Generated themes are committed
        run: git diff --exit-code -- themes icons
      - run: npx -y @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
  publish:
    needs: package
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First release: an OVSX_PAT secret claims the namespace and publishes (Open VSX only accepts a
      # trusted publisher for an extension that already has a version). After that, register this
      # workflow as the trusted publisher on open-vsx.org and delete the secret — releases then
      # authenticate with a short-lived GitHub OIDC token.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx -y ovsx create-namespace "$(node -p "require('./package.json').publisher")" -p "$OVSX_PAT" || true
            npx -y ovsx publish *.vsix -p "$OVSX_PAT"
          else
            npx -y ovsx publish *.vsix --trusted-publishing
          fi
