name: Build & Release
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Every push / PR: regenerate, check the committed themes match, package the .vsix.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Theme JSONs are generated from palette.mjs / variants.mjs; the Dune key list is optional at
      # build time (validation skips the key-name check when it is absent).
      - run: node build.mjs
      - name: Generated themes are committed
        run: git diff --exit-code -- themes icons
      - run: npx -y @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

  # main only: tishlang/sem reads the conventional commits since the last tag (feat → minor,
  # fix/perf → patch, breaking → major, chore/docs/ci → nothing), tags + creates the GitHub release,
  # and this job publishes that exact version to Open VSX. Nothing is committed back to main.
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: tishlang/sem@v1
        id: sem
        with:
          config: |
            branches: [main]
            tagFormat: v${version}
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - "@sem/github"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the released version
        if: steps.sem.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.sem.outputs.new_release_version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node build.mjs
          npx -y @vscode/vsce package --no-dependencies
      # Token while the OVSX_PAT secret exists (first releases); once this workflow is registered as
      # the namespace's trusted publisher on open-vsx.org, delete the secret and releases authenticate
      # with a short-lived GitHub OIDC token instead.
      - name: Publish to Open VSX
        if: steps.sem.outputs.new_release_published == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx -y ovsx publish *.vsix -p "$OVSX_PAT"
          else
            npx -y ovsx publish *.vsix --trusted-publishing
          fi
      - name: Attach the .vsix to the GitHub release
        if: steps.sem.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.sem.outputs.new_release_git_tag }}
        run: gh release upload "$TAG" *.vsix --clobber
